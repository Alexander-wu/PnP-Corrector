### base config ###
# -*- coding: utf-8 -*-
full_field: &FULL_FIELD
  loss: 'l2'
  lr: 1E-3
  max_epochs: 200
  batch_size: 32
  scheduler: 'ReduceLROnPlateau'
  num_data_workers: 4
  dt: 1                     
  n_history: 0              
  prediction_type: 'iterative'
  prediction_length: 41    
  n_initial_conditions: 5  
  ics_type: "default"      
  date_strings: ["2018-09-14 00:00:00"]
  save_raw_forecasts: !!bool True
  save_channel: !!bool False
  masked_acc: !!bool False
  maskpath: None
  perturb: !!bool False
  add_grid: !!bool False
  N_grid_channels: 0
  gridtype: 'sinusoidal'    # options 'sinusoidal' or 'linear'
  roll: !!bool False
  enable_nhwc: !!bool False
  optimizer_type: 'FusedAdam'

  # directory path to store training checkpoints and other output
  exp_dir: 'exp'

  # data
  train_data_path: '../data/ocean/train'
  valid_data_path: '../data/ocean/valid'
  test_data_path:  '../data/ocean/test'

  # land mask
  land_mask: !!bool True
  land_mask_path: '../data/ocean/land_mask.h5'

  # normalization
  normalize: !!bool True
  normalization: 'zscore' # options zscore, minmax, zscore_lat
  global_means_path: '../data/ocean/mean_s_t_ssh_coupler.npy' 
  global_stds_path:  '../data/ocean/std_s_t_ssh_coupler.npy'

  # orography
  orography: !!bool False

  # noise
  add_noise: !!bool False
  noise_std: 0

  # crop
  crop_size_x: None
  crop_size_y: None

  log_to_screen: !!bool True
  log_to_wandb: !!bool False
  save_checkpoint: !!bool True
  plot_animations: !!bool False


#############################################
